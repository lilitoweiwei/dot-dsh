# web-plus profile: the PlusZero (加灵) system-management surface.
#
# Applied after dsh-base and dsh-web-app. Base keeps every seam; web-app
# disables the tool rows so each session mounts its own agent preset. This
# layer restates web-provider choices and pins the default agent preset.
#
# /api 信任名单不在此写死：connection 行沿用 web-app 基础组合的
# `trustedHosts: !!js ctx.webRuntime.trustedHosts`，由各机器服务启动参数
# --trusted-host 注入（dsh 传 dsh 域名，dshu 传 dshu 域名）。

# Web: 挂载 HTTP fetch provider 与 Tavily search provider；显式选中 tavily。
- insert:
    # fetch provider：web_fetch 的后端。base 默认不挂（SSRF 由
    # incus 配置 + tailscale ACL 控制），由本 profile 显式挂载。
    - id: web-fetch-http
      name: '@deepseek-ai/dsh-web-fetch-http'

    # search provider：web_search 的后端，git submodule 挂载于
    # ~/.dsh/plugins/dsh-web-search-tavily（源码即入口，无构建）。
    - id: web-search-tavily
      # submodule: ~/.dsh/plugins/dsh-web-search-tavily（相对 profile 目录 ../../ 上溯两级）
      name: '../../plugins/dsh-web-search-tavily/src/index.js'

# 覆盖 web-app 层插入的 agent-presets 行：默认 preset 切换为 pluszero。
- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: pluszero

# Web seam：显式选中 Tavily 作为 web_search 的 provider（确定性选择，
# 不依赖"唯一可用自动选中"）。
- id: web
  config:
    searchProvider: tavily

# 禁用 DeepSeek 官方 search provider：web_search 由 Tavily 提供。
- id: web-search-deepseek
  disabled: true
