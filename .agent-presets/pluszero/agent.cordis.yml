# The `pluszero` agent preset: the PlusZero (加灵) system-management agent.
#
# This is an AGENT-PLANE composition. The roster mounts it ONCE under a standing
# scope; every session naming it joins by scope parentage. The host composition
# (dsh-base + dsh-web-app + the web-plus profile patch) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# Design choices vs `standard`:
#   - one-shot `bash` only (no persistent bash / no terminal tools)
#   - filesystem suite with sandbox escalation
#   - web fetch enabled, web search enabled (Tavily-backed provider)
#   - subagents allowed at depth 1 (no nesting)
#   - compaction kept (automatic + human /compact)
#   - skills enabled: filesystem discovery + `skill` tool (user root ~/.dsh/skills)
#   - deliberately absent: goal, workflow/ralph, todo, plan-mode, ask-user,
#     presentation, terminal, str-replace-editor, pwsh, fork, cordis
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm and `dsh-agent-presets` rejects
# the mount. Rows that only register model-facing tools need no realm.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You are the PlusZero system-management agent powered by the {{model}} model.
      Your working directory is {{cwd}}.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536
    # 自动注入 README：让"只有 README 没有 AGENTS.md"的仓库（如 ~/.dsh）也能被
    # workspace 指令机制发现。此字段整组替换默认候选（AGENTS.md + CLAUDE.md）。
    instructionFileCandidates: ['AGENTS.md', 'CLAUDE.md', 'README.md']

# ── shell ───────────────────────────────────────────────────────────────────

# One-shot `bash -c`: fresh shell per call, sandbox escalation via
# `sandbox_permissions` + `justification`. No persistent/terminal tools.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ─────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY (`dsh-skill`) stays in the host composition; these rows
# register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` discovers roots (project, custom, ~/.dsh/skills,
# ~/.agents/skills) and `tool-skill` gives the agent the catalog and loader.
# Skills in the user root are shared by every skill-enabled preset.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner
# must share this realm rather than sit outside it.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation ──────────────────────────────────────────────────────────────

# One level of subagents only: `maxDepth: 1` forbids a child spawning its own
# child. No workflow / ralph / fork.
- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'

- id: tool-subagent-list-agents
  name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
    maxDepth: 1

# ── remaining model-facing rows ─────────────────────────────────────────────

# Web: fetch and search enabled. `web-fetch-http` and the Tavily search
# provider are mounted on the host plane by the web-plus profile patch.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    search: true
    fetch: true
    searchTimeoutMs: 60000
