# web-plus profile: the PlusZero (加灵) system-management surface.
#
# Applied after dsh-base and dsh-web-app. Base keeps every seam; web-app
# disables the tool rows so each session mounts its own agent preset. This
# layer restates the web-provider choices, pins the default agent preset, and
# mounts this deployment's own plugins.
#
# 这个文件是 profile patch 层：对已存在的行是「整段替换 config」。所以覆盖任何
# 一行，都必须把它原有的键全部重述（见 connection、web 两处的说明）。
#
# /api 信任名单不写死：connection 行沿用 web-app 的
# `trustedHosts: !!js ctx.webStartup.trustedHosts`，权威由各机器服务启动参数
# --trusted-host 注入（dsha 传 dsha 域名，dshu 传 dshu 域名）。

# Web: 挂载 Tavily search provider（git submodule，源码即入口，无构建）。
# `searchDepth: basic` = 1 credit/请求且延迟更低；插件默认是 advanced
# （2 credits/请求），本机免费 key 反复撞额度上限，故降档。插件不发
# `auto_parameters`，写死 basic 不会被 Tavily 自动升回 advanced。
# 配置写在 insert 条目自己身上，让这一行始终只出现在一处。
- insert:
    - id: web-search-tavily
      name: '../../plugins/dsh-web-search-tavily/src/index.js'
      config:
        searchDepth: basic
- insert:
    - id: web-pwa
      name: '../../plugins/dsh-web-pwa/src/index.js'
      config:
        # 上游 manifest 只给一个 `sizes:"any"` 的 SVG 图标，Chrome 解析成 0x0 →
        # 可安装性检查不过；且 Chrome 取 manifest 的 fetch 是 credentials: omit，
        # 本部署网关对所有路径要鉴权 ⇒ 拿到登录页 ⇒ manifest 解析失败。插件自带
        # 光栅图标，并把 index 里的 manifest 链接改指自己的路由（附
        # crossorigin="use-credentials"）。
        #
        # 上游 manifest 是 `fullscreen`（连 Android 状态栏一起隐藏），手机上退回/
        # 看时间都要额外手势。`standalone` 同样"没有浏览器 UI"，但保留系统状态栏
        # 与系统导航栏 —— 这才是想要的观感。（插件默认仍是 fullscreen；选哪个模式
        # 属部署选择，故写在这里。）
        display: standalone

# ── Agent preset：声明式 ─────────────────────────────────────────────────────
#
# DSH 不再从 `$DSH_HOME/.agent-presets/` 发现 preset：preset 必须由 patch 里的
# 一行 `@deepseek-ai/dsh-agent-preset` 声明。老会话头里记着
# `agentPreset: pluszero`，注册表对缺失定义会拒绝恢复 —— 所以这不是可选项。
#
# 注册表（选择 + 代际保留）与声明（标识/元数据/子插件列表）是两个包两行。
# `plugins:` 下面是 preset 的 entry list，可以带 `!!js` 表达式：声明插件的 group
# marker 会把它们保留到各自插件加载时再求值。
- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: pluszero

# preset 声明是**插入**新行（上游 shipped preset 用的也是这种形态）；写成普通
# by-id 覆盖行会得到 `patch: entry "preset-pluszero" not found`。
- insert:
    - id: preset-pluszero
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: pluszero
        name: PlusZero（加灵）
        description: 系统管理 Agent：一次性 Bash、文件、网页获取、技能、一层子代理，带沙盒提权。
        order: 1
        plugins:
          # The `pluszero` agent preset: the PlusZero (加灵) system-management agent.
          #
          # This is an AGENT-PLANE composition. The roster mounts it ONCE under a standing
          # scope; every session naming it joins by scope parentage. The host composition
          # (dsh-base + dsh-web-app + the web-plus profile patch) keeps everything a
          # preset must not own: the registries themselves, the sandbox and approval
          # stack, persistence, and the model route.
          #
          # Design choices vs `standard`:
          #   - one-shot `bash` only (no persistent bash / no terminal tools)
          #   - filesystem suite with sandbox escalation
          #   - web fetch enabled, web search enabled (Tavily-backed provider)
          #   - subagents allowed at depth 1 (no nesting)
          #   - compaction kept (automatic + human /compact)
          #   - skills enabled: filesystem discovery + `skill` tool (user root ~/.dsh/skills)
          #   - request clock context, a per-session task list, scheduled tasks, Office tools
          #   - `present` enabled: the agent declares final files as deliveries, rendered as
          #     cards by the Web client (dsh-client-ui-deliverables, shipped in dsh-web-app)
          #   - deliberately absent: goal (including the human `/goal` command),
          #     workflow/ralph, plan-mode, ask-user, `tool-presentation` (PTC's
          #     presentation selector — NOT the `present` tool above), terminal,
          #     str-replace-editor, pwsh, fork, cordis, plugin manager/market
          #
          # A service row here MUST sit inside a group carrying an `isolate` realm.
          # Without one it publishes into the root realm and `dsh-agent-presets` rejects
          # the mount. Rows that only register model-facing tools need no realm.

          # ── identity ────────────────────────────────────────────────────────────────

          # persona 只有 prefix，不写 suffix：agent-loop 只注册 `{{provider}}` /
          # `{{model}}` 两个 prompt 变量，带 `{{cwd}}` 的 suffix 会让每个会话第一条
          # 请求就抛 `unknown prompt variable`。工作目录那句由 base 的
          # working-directory 服务自己注入。
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are the PlusZero system-management agent powered by the {{model}}
                model.

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
              # 自动注入 README：让"只有 README 没有 AGENTS.md"的仓库（如 ~/.dsh）也能被
              # workspace 指令机制发现。此字段整组替换默认候选（AGENTS.md + CLAUDE.md）。
              instructionFileCandidates: [ 'AGENTS.md', 'CLAUDE.md', 'README.md' ]

          # 请求时钟上下文：把"当前时间 / 时区 / 距上条模型可见事件多久"作为一条消息
          # 注入，默认 10 分钟最多一次（`refreshIntervalMs` 可调）。没有工具定义。
          # 不配 `timeZone`：浏览器上报的时区优先，缺了才回落到进程时区。
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

          # ── shell ───────────────────────────────────────────────────────────────────

          # One-shot `bash -c`: fresh shell per call, sandbox escalation via
          # `sandbox_permissions` + `justification`. No persistent/terminal tools.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          # ── filesystem ──────────────────────────────────────────────────────────────

          # 不给 apply_patch：schema 默认本就是 false，显式写出来挡住未来的默认值
          # 漂移，同时把"只要 edit、不要 apply_patch"这个意图留在配置里。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ─────────────────────────────────────────────────────────

          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── work organization ───────────────────────────────────────────────────────

          # 会话内任务清单（`todo_write`）。GUI 的「任务」面板由 ui-conversation 挂载，
          # 步骤多时能直接看到进度。`allowParallelInProgress` 是必填键（没有默认值），
          # 取 true：允许同时推进多项（与上游 standard 一致）。
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # 定时任务四件套（`schedule_create/list/view/edit`）。任务属于 Host 而不属于
          # 某个会话：创建时用 `target` 选投递目标（this_session / new_once / new）。
          # 模型侧有一段 "需用户明确授权才能创建或修改" 的共享提示。Host 的 `schedule`
          # 服务与 GUI 的 Schedule 页都由 web-app 提供，这里只补工具。
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'

          # ── skills ──────────────────────────────────────────────────────────────────

          # The skill REGISTRY (`dsh-skill`) stays in the host composition; these rows
          # register into THIS preset's layer of it, so they need no realm.
          # `skill-filesystem` discovers roots (project, custom, ~/.dsh/skills,
          # ~/.agents/skills) and `tool-skill` gives the agent the catalog and loader.
          # Skills in the user root are shared by every skill-enabled preset.
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── goals（显式排除）─────────────────────────────────────────────────────────

          # 刻意不启用 goal。上游把 `/goal` 命令与 goal 工具都划归 preset 所有：
          # `packages/bundle/web-app/cordis.patch.yml` 会把 host 面的 `command-goal` 与
          # `tool-goal` 两行一起禁用（注释原文 "Presets own the human command and
          # model-facing tool"），因此不写这两行 = 本 preset 的会话既没有 `/goal`，也无法
          # 创建 goal。
          #
          # 两行以 `disabled: true` 显式列出，只为把"排除"写成可核对的配置（上游对可选
          # provider 也是这个写法）：Loader 不加载它们，preset 的插件清单会把它们显示为
          # disabled。
          #
          # 要启用就整组启用（同时去掉两行的 `disabled`）：goal 服务与 round-driver 始终
          # 留在 host 面并会自动续跑（默认上限 256 轮），只挂命令不挂工具会让模型不知道
          # goal 存在、也无法 complete/block，从而可能空转到上限。
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
            disabled: true

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
            disabled: true

          # ── compaction ──────────────────────────────────────────────────────────────

          # `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner
          # must share this realm rather than sit outside it.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation ──────────────────────────────────────────────────────────────

          # One level of subagents only: `maxDepth: 1` forbids a child spawning its own
          # child. No workflow / ralph / fork.
          # `interrupt` 不写会吃插件默认 true（多出一个 interrupt_agent 工具），与
          # base 及三个自带 preset 的 false 分叉，故显式对齐。
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
            config:
              interrupt: false

          # 委派是「托管 activation」：立即返回名字，结果走完成通知。上游已删除
          # `backgroundMode` 键（写了也静默忽略），这里不写。
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              maxDepth: 1

          # ── remaining model-facing rows ─────────────────────────────────────────────

          # Web: fetch and search enabled. `web-fetch-http` and the Tavily search
          # provider are mounted on the host plane by the web-plus profile patch.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              search: true
              fetch: true
              searchTimeoutMs: 60000
              # 上游默认是 10 queries / 10 results。Tavily 走免费 key + basic 档，
              # 一次搜索按 queries 计费，这里显式钉回 4 / 8。
              searchMaxQueries: 4
              searchMaxResults: 8

          # Office 三件套（`office_render/convert/recalculate`）。按技能激活：只有加载过
          # office / office-docx / office-xlsx / office-pptx 之一，工具才会在下一步出现，
          # 平时不占工具定义。转换引擎是 host 的 `office-kit` 行（web-app 已挂），
          # Python 技能走 `pythonEnvironment: user`（本机没有 workspace-dependencies）。
          - id: tool-office
            name: '@deepseek-ai/dsh-tool-office'

          # 文件交付：`present(files: [{path, description?}])` 把已存在的文件声明为交付
          # 物，Web 端渲染成卡片（点卡片→右侧栏预览）。只记录路径与描述：不读内容、
          # 不复制、不进模型消息，默认每次最多 8 个文件。
          - id: present
            name: '@deepseek-ai/dsh-tool-present'

# Web seam：显式选中 Tavily 作为 web_search 的 provider（确定性选择，不依赖
# "唯一可用自动选中"）。`fetchProvider: http` 必须跟着重述 —— 整段替换 config。
- id: web
  config:
    searchProvider: tavily
    fetchProvider: http

# ── 先读后写防护：显式打开 ───────────────────────────────────────────────────
#
# base 以 `disabled: true` 交付这一行：`write` 直接覆盖、`edit` 直接替换字面文本，
# "先读后写"的观察校验整体消失。本机的系统提示词仍在宣称这条约束（工具描述也依赖
# 它），所以这里按老行为打开。
- id: fs-observation-policy
  disabled: false

# 浏览器会话（connection）行覆盖：把 cookie 有效期从默认 30 天提高到 1 年，
# 以降低"首次访问需从日志取启动令牌"的频率（令牌只在每浏览器 + 每 authority
# 的首次交换时需要；cookie 跨进程重启有效，签名密钥持久化在 credentials 的
# client-connection/browser-session）。
#
# 必须整行重述：patch 是「整段替换 config」。漏掉 `inject` 会让这行等一个永不挂载
# 的服务，Web UI 根本不启动；漏掉 `trustedHosts` 会让域名进不了 /api 围栏，
# 所有请求 403。
- id: connection
  name: '@deepseek-ai/dsh-client-connection'
  inject: [ webStartup ]
  config:
    trustedHosts: !!js ctx.webStartup.trustedHosts
    cookieMaxAgeDays: 365

# ── 会话日志上传：显式关闭 ───────────────────────────────────────────────────
#
# `@deepseek-ai/dsh-session-log-deepseek` 会把「规范会话日志的增量事件」作为
# `dsh_session_log` 字段附在每个走官方 DeepSeek API 的请求上（含未进模型的元数据
# 事件，如 sandbox/mode、approval/policy、permission/preset、workspace/changes、
# compaction/prune，以及已被 compaction 剪除的历史；上游代码里没有脱敏）。
# schema 默认是 `enabled: true`，所以必须显式关。
#
# 本行在 profile patch（= GUI 写入的那一层）：设置 → 通用 的开关不再能把它打开。
# 验收方式：新会话里不出现 `session-log-deepseek/delivery-accepted` 事件。
- id: session-log-deepseek
  name: '@deepseek-ai/dsh-session-log-deepseek'
  config:
    enabled: false
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      opencode-go:
        apiKeyEnv: OPENCODE_GO_API_KEY
        # 内置目录把 deepseek-v4.1-flash 的 off 判为不支持（目录数据
        # `thinkingLevelMap.off = null`，而 `getSupportedThinkingLevels` 把 null 读成
        # 不支持，见 packages/llm/llm-pi-ai/src/models.ts），于是选择器里没有 Off。
        # 这里只重塑这一个模型，显式声明四级：off 留空 = 支持且不发送推理字段，
        # `thinkingFormat: deepseek` 的分派据此发出 thinking:{type:"disabled"}。
        modelOverrides:
          deepseek-v4.1-flash:
            reasoningEfforts:
              off:
              low: low
              high: high
              max: max
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: opencode-go
    model: deepseek-v4.1-flash
    reasoningEffort: high
# 欢迎公告的「最后确认版本」：与源码常量 WELCOME_NOTICE_VERSION 精确相等才算已读，
# 所以值等于当前常量就表示看过最新公告。GUI 在你点掉公告时把新值写回这里。
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
# 正文字号 15（默认 14）；代码块与终端的字号保持默认（11 / 13）。
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    fontSize: 15

# ── dsh-wsjump：侧栏工作区面板（submodule plugins/dsh-wsjump）────────────────
#
# 入口指向构建产物 lib/index.js（lib/ 不进版本管理，构建与挂载细节见插件 README）。
# 二进制走 PATH 里的 `wsjump`（~/ws/bin 由 home-manager sessionPath 注入），插件
# 本身默认就按裸名解析并顺带找回配置文件，故不需要 wsjumpPath。
- insert:
    - id: dsh-wsjump
      name: '../../plugins/dsh-wsjump/lib/index.js'
